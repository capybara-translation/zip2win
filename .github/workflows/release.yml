name: release
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # Runs only after the tests and govulncheck pass, so a broken or knowingly
  # vulnerable build is never published. Go is the latest stable release (see
  # test.yml for why).
  # Kept in its own job so the tests never run with a write-capable token.
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub Release. The Homebrew tap lives in another repository,
      # so it is pushed with HOMEBREW_TAP_TOKEN instead.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs full history and tags for the version and changelog.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
